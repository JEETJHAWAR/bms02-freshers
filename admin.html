<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The list — BMS-02 Freshers admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120720'/%3E%3Ccircle cx='11' cy='12' r='4' fill='%23FF2E7E'/%3E%3Ccircle cx='21' cy='20' r='4' fill='%23FFC24B'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/bigshoulders.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{font-family:'Big Shoulders';src:url('fonts/bigshoulders.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Manrope';src:url('fonts/manrope.woff2') format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'DM Mono';src:url('fonts/dmmono.woff2') format('woff2');font-weight:400 500;font-display:swap}

:root{
  --ink:#120720; --ink-2:#1A0C2C; --panel:#221038;
  --line:rgba(247,240,230,.13); --line-2:rgba(247,240,230,.24);
  --paper:#F7F0E6; --muted:#B7A6CB; --muted-2:#8F7EA6;
  --hot:#FF2E7E; --hot-dim:rgba(255,46,126,.14);
  --amber:#FFC24B; --amber-dim:rgba(255,194,75,.13);
  --disp:'Big Shoulders','Archivo Narrow','Arial Narrow',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);
     font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--hot);color:#fff}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
.hidden{display:none !important}

.wrap{width:100%;max-width:1060px;margin-inline:auto;padding:clamp(20px,4vw,40px)}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);margin:0 0 10px}
.eyebrow b{color:var(--amber);font-weight:500}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);
  line-height:.92;text-transform:uppercase;margin:0 0 6px}
h1 i{font-style:normal;color:var(--hot)}
.sub{color:var(--muted);margin:0 0 26px;font-size:.95rem}

/* ===== password gate ===== */
.gate{max-width:420px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:clamp(22px,5vw,30px)}
.gate label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.055em;margin-bottom:9px}
.gate input{width:100%;font-family:var(--body);font-size:16px;color:var(--paper);
  background:rgba(0,0,0,.26);border:1px solid var(--line-2);border-radius:10px;padding:13px 15px}
.gate input:focus{outline:none;border-color:var(--amber);background:rgba(0,0,0,.42);
  box-shadow:0 0 0 3px rgba(255,194,75,.16)}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  background:var(--hot);color:#fff;font-family:var(--body);font-weight:700;font-size:16px;
  padding:13px 24px;border-radius:999px;margin-top:14px;
  transition:transform .16s ease,filter .16s ease;box-shadow:0 6px 24px -10px rgba(255,46,126,.85)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.err{color:#FF8FB4;font-size:.86rem;margin-top:10px;font-family:var(--mono)}
.wake{margin:14px 0 0;font-size:.82rem;color:var(--muted-2);line-height:1.5}

/* ===== stats ===== */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 18px;min-width:104px}
.stat b{display:block;font-family:var(--disp);font-weight:800;font-size:1.9rem;line-height:1}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted-2)}
.stat.hot b{color:var(--hot)} .stat.amber b{color:var(--amber)}

/* ===== controls ===== */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{appearance:none;border:0;cursor:pointer;font-family:var(--body);font-size:14.5px;font-weight:600;
  color:var(--muted);background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px var(--line-2);
  padding:9px 16px;border-radius:999px;transition:all .15s ease}
.tab:hover{color:var(--paper)}
.tab[aria-pressed=true]{background:var(--hot-dim);color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--hot)}
.controls input{flex:1;min-width:150px;font-family:var(--body);font-size:15px;color:var(--paper);
  background:rgba(0,0,0,.26);border:1px solid var(--line-2);border-radius:999px;padding:9px 16px}
.controls input:focus{outline:none;border-color:var(--amber)}
.controls input::placeholder{color:#8272A0}
.mini{appearance:none;border:0;cursor:pointer;background:rgba(0,0,0,.3);color:var(--paper);
  box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;padding:9px 16px;
  font-family:var(--body);font-size:14px;font-weight:600}
.mini:hover{box-shadow:inset 0 0 0 1px var(--paper)}

/* ===== cards ===== */
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;overflow-wrap:anywhere}
.card h3{font-family:var(--disp);text-transform:uppercase;font-weight:800;
  font-size:1.45rem;line-height:1;margin:0 0 4px;padding-right:36px}
.del{position:absolute;top:12px;right:12px;appearance:none;border:0;cursor:pointer;
  width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);color:var(--muted-2);
  box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:1}
.del:hover{color:#FF8FB4;box-shadow:inset 0 0 0 1px var(--hot)}
.del[disabled]{opacity:.5;cursor:not-allowed}
.card .roll{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted-2);margin:0 0 12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.badges span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px}
.badges .act{background:var(--hot-dim);box-shadow:inset 0 0 0 1px rgba(255,46,126,.5)}
.badges .vol{background:var(--amber-dim);box-shadow:inset 0 0 0 1px rgba(255,194,75,.5)}
.meta{font-size:.88rem;color:var(--muted);margin:0 0 4px}
.meta b{color:var(--paper);font-weight:600}
.notes{font-size:.88rem;color:var(--muted);border-left:2px solid var(--line-2);
  padding-left:12px;margin:10px 0 0;white-space:pre-wrap}
.contact{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}

.empty{color:var(--muted);font-family:var(--mono);font-size:.9rem;padding:30px 0}
.footnote{margin-top:34px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted-2)}

/* ===== print (the "Save as PDF" button) ===== */
@media print{
  body{background:#fff;color:#000}
  .gate,.controls,.footnote,.del{display:none !important}
  .eyebrow,.eyebrow b,.sub{color:#555}
  h1 i{color:#000}
  .stat{border:1px solid #bbb;background:#fff}
  .stat b{color:#000 !important}
  .stat span{color:#555}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{background:#fff;border:1px solid #bbb;break-inside:avoid}
  .card .roll,.meta,.notes{color:#333}
  .meta b{color:#000}
  .badges span{box-shadow:none;border:1px solid #888;background:#fff;color:#000}
  .contact{border-top:1px solid #ddd}
  .contact a{color:#000}
}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow"><b>BMS-01</b> only · Freshers 2026</p>
  <h1>The list<i>.</i></h1>
  <p class="sub" id="subline">Everyone who has signed up, straight from the sheet.</p>

  <!-- password gate -->
  <form class="gate" id="gate">
    <label for="pass">Admin password</label>
    <input type="password" id="pass" autocomplete="current-password" autofocus>
    <div class="err hidden" id="gateErr"></div>
    <button type="submit" class="btn" id="gateBtn">Open the list</button>
    <p class="wake">Runs on Google's free tier — checking takes a few seconds.</p>
  </form>

  <!-- the list -->
  <div class="hidden" id="panel">
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>Signed up</span></div>
      <div class="stat hot"><b id="stPerf">0</b><span>Performing</span></div>
      <div class="stat amber"><b id="stVol">0</b><span>Volunteering</span></div>
    </div>

    <div class="controls">
      <div class="tabs" id="tabs" role="group" aria-label="Filter">
        <button type="button" class="tab" data-tab="all"  aria-pressed="true">Everyone</button>
        <button type="button" class="tab" data-tab="perf" aria-pressed="false">Performers</button>
        <button type="button" class="tab" data-tab="vol"  aria-pressed="false">Volunteers</button>
      </div>
      <input type="search" id="q" placeholder="Search name, roll, act…">
      <button type="button" class="mini" id="refresh">Refresh</button>
      <button type="button" class="mini" id="csv">Excel (CSV)</button>
      <button type="button" class="mini" id="pdf">Save PDF</button>
    </div>

    <div class="cards" id="cards"></div>
    <p class="empty hidden" id="empty">Nobody here yet.</p>

    <p class="footnote">The data lives in the Google Sheet — deleting here deletes the row there too.</p>
  </div>
</div>

<script>
/* Same Apps Script endpoint as CONFIG.endpoint in index.html — keep in sync. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyqCfRXTdjuUhr6cb1lTiIV6_8CIh5FPJw46gHj24WX9pgP7HpjVC4GMu_z_BIDFK3Zcg/exec";

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let PASS = null, ENTRIES = [], tab = "all";

// wake Google's server while the password is being typed — shaves the cold start
fetch(ENDPOINT + "?stats=1").catch(()=>{});

$("#gate").addEventListener("submit", e=>{ e.preventDefault(); load($("#pass").value); });
$("#refresh").addEventListener("click", ()=>load(PASS));
$("#q").addEventListener("input", render);

$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  tab = b.dataset.tab;
  $$(".tab").forEach(t=>t.setAttribute("aria-pressed", String(t===b)));
  render();
});

async function load(pass){
  if(!pass){ gateFail("Password, please."); return; }
  const btn = $("#gateBtn"), rf = $("#refresh");
  btn.disabled = rf.disabled = true; btn.textContent = "Checking…"; rf.textContent = "Refreshing…";
  $("#gateErr").classList.add("hidden");
  try{
    const r = await fetch(ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},   // avoids a CORS preflight
      body: JSON.stringify({ action:"admin", pass: pass })
    });
    const out = await r.json();
    if(!out.ok) throw new Error(out.error || "rejected");
    PASS = pass;
    ENTRIES = out.rows.map(row=>Object.fromEntries(out.keys.map((k,i)=>[k, row[i]])));
    $("#gate").classList.add("hidden");
    $("#panel").classList.remove("hidden");
    $("#subline").textContent = "Everyone who has signed up, straight from the sheet.";
    stats(); render();
  }catch(err){
    gateFail(/Wrong password/i.test(err.message)
      ? "That's not it. Try again."
      : "Couldn't reach the sheet — check your connection and try again.");
  }finally{
    btn.disabled = rf.disabled = false; btn.textContent = "Open the list"; rf.textContent = "Refresh";
  }
}

function gateFail(msg){
  const box = $("#gateErr");
  box.textContent = msg; box.classList.remove("hidden");
  if($("#gate").classList.contains("hidden")) alert(msg);   // refresh failed while inside
}

function stats(){
  $("#stTotal").textContent = ENTRIES.length;
  $("#stPerf").textContent  = ENTRIES.filter(x=>x.performing   === "Yes").length;
  $("#stVol").textContent   = ENTRIES.filter(x=>x.volunteering === "Yes").length;
}

function shown(){
  const q = $("#q").value.trim().toLowerCase();
  let list = ENTRIES;
  if(tab === "perf") list = list.filter(x=>x.performing   === "Yes");
  if(tab === "vol")  list = list.filter(x=>x.volunteering === "Yes");
  if(tab !== "all")  list = [...list].sort((a,b)=>a.name.localeCompare(b.name));
  if(q) list = list.filter(x=>
    [x.name,x.roll,x.email,x.acts,x.actNotes].join(" ").toLowerCase().includes(q));
  return list;
}

function render(){
  const list = shown();
  $("#empty").classList.toggle("hidden", list.length > 0);
  $("#cards").innerHTML = list.map(card).join("");
}

function card(x){
  const badges =
    (x.performing === "Yes" && x.acts ? x.acts.split(", ").map(a=>`<span class="act">${esc(a)}</span>`) : [])
    .concat(x.volunteering === "Yes" ? ['<span class="vol">Volunteer</span>'] : []).join("");

  const meta = [];
  if(tab !== "vol" && x.performing === "Yes"){
    if(x.teamSize) meta.push(`<p class="meta">Group of <b>${esc(x.teamSize)}</b></p>`);
    if(x.duration) meta.push(`<p class="meta">Length: <b>${esc(x.duration)}</b></p>`);
  }
  const notes = tab !== "vol" && x.performing === "Yes" && x.actNotes
    ? `<p class="notes">${esc(x.actNotes)}</p>` : "";

  const phone = String(x.phone || "").replace(/\D/g,"");
  return `<div class="card">
    <button type="button" class="del" data-email="${esc(x.email)}"
      aria-label="Delete ${esc(x.name)}'s entry" title="Delete this entry">✕</button>
    <h3>${esc(x.name)}</h3>
    <p class="roll">${esc(x.roll)}</p>
    <div class="badges">${badges}</div>
    ${meta.join("")}${notes}
    <div class="contact">
      ${phone ? `<a href="https://wa.me/91${esc(phone)}" target="_blank" rel="noopener">WhatsApp ${esc(x.phone)}</a>` : ""}
      <a href="mailto:${esc(x.email)}">${esc(x.email)}</a>
    </div>
  </div>`;
}

/* ===== delete an entry (removes the row from the sheet) ===== */
$("#cards").addEventListener("click", async e=>{
  const b = e.target.closest(".del"); if(!b) return;
  const email = b.dataset.email;
  const x = ENTRIES.find(v=>v.email === email); if(!x) return;
  if(!confirm(`Delete ${x.name}'s entry?\n\nThis removes their row from the sheet for good — there's no undo.`)) return;
  b.disabled = true; b.textContent = "…";
  try{
    const r = await fetch(ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"admin-delete", pass: PASS, email: email })
    });
    const out = await r.json();
    if(!out.ok) throw new Error(out.error || "rejected");
    ENTRIES = ENTRIES.filter(v=>v.email !== email);
    stats(); render();
  }catch(err){
    alert("Couldn't delete — " + err.message + ". Try a refresh first.");
    b.disabled = false; b.textContent = "✕";
  }
});

/* ===== exports: CSV opens in Excel, PDF via the print dialog ===== */
$("#csv").addEventListener("click", ()=>{
  const cols = [["Name","name"],["Roll no","roll"],["WhatsApp","phone"],["Email","email"],
    ["Performing","performing"],["Acts","acts"],["Group size","teamSize"],
    ["Duration","duration"],["Act notes","actNotes"],["Volunteering","volunteering"]];
  const cell = v=>{
    v = String(v == null ? "" : v);
    if(/^[=+\-@]/.test(v)) v = "'" + v;          // keep Excel from running it as a formula
    return '"' + v.replace(/"/g,'""') + '"';
  };
  const lines = [cols.map(c=>cell(c[0])).join(",")]
    .concat(shown().map(x=>cols.map(c=>cell(x[c[1]])).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"}));
  a.download = `bms02-freshers-${tab === "all" ? "everyone" : tab === "perf" ? "performers" : "volunteers"}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

$("#pdf").addEventListener("click", ()=>print());
</script>
</body>
</html>
